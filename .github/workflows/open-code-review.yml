name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: open-code-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/open-code-review') ||
          startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);

      - name: Test GitHub Models tool calling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: openai/gpt-4.1-mini
        shell: bash
        run: |
          payload="$(jq -nc --arg model "$MODEL" '{
            model: $model,
            messages: [
              {role: "user", content: "Call the task_done tool once."}
            ],
            tools: [
              {
                type: "function",
                function: {
                  name: "task_done",
                  description: "Finish the test",
                  parameters: {type: "object", properties: {}}
                }
              }
            ],
            tool_choice: "auto"
          }')"

          http_code="$(curl -sS \
            -o /tmp/github-models-test.json \
            -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://models.github.ai/inference/chat/completions \
            -d "$payload")"

          if [[ "$http_code" != '200' ]]; then
            echo "GitHub Models preflight failed with HTTP $http_code" >&2
            jq . /tmp/github-models-test.json >&2 || true
            exit 1
          fi

          jq '{model, finish_reason: .choices[0].finish_reason, tool_calls: (.choices[0].message.tool_calls | length)}' \
            /tmp/github-models-test.json

      - name: Configure OCR endpoint
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g '@alibaba-group/open-code-review@1.8.0' >/dev/null
          ocr config set llm.url 'https://models.github.ai/inference/chat/completions' >/dev/null
          ocr config set llm.auth_token "$GITHUB_TOKEN" >/dev/null
          ocr config set llm.model 'openai/gpt-4.1-mini' >/dev/null
          ocr config set llm.protocol 'openai' >/dev/null
          ocr config set llm.extra_body '{"max_completion_tokens":4096}' >/dev/null
          ocr config set language '中文' >/dev/null

      - name: Run OpenCodeReview
        id: ocr
        continue-on-error: true
        uses: alibaba/open-code-review@v1.8.0
        with:
          # The endpoint is configured above so llm.extra_body is not shadowed
          # by the action's OCR_LLM_* environment variables.
          llm_url: ''
          llm_auth_token: ''
          llm_model: ''
          llm_use_anthropic: 'false'
          llm_extra_body: '{"max_completion_tokens":4096}'
          language: 中文
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          background: ${{ steps.pr.outputs.title }}
          ocr_version: 1.8.0
          review_concurrency: '2'
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'true'

      - name: Upload OCR session diagnostics
        if: always() && steps.ocr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.opencodereview/sessions
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce review gate
        if: always()
        shell: bash
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          if [[ "$OCR_OUTCOME" != 'success' ]]; then
            echo "OpenCodeReview action failed: $OCR_OUTCOME" >&2
            exit 1
          fi

          if [[ ! -s /tmp/ocr-result.json ]]; then
            echo 'OpenCodeReview did not produce a JSON result.' >&2
            exit 1
          fi

          status="$(jq -r '.status // "unknown"' /tmp/ocr-result.json)"
          if [[ "$status" == 'completed_with_errors' || "$status" == 'unknown' ]]; then
            echo "OpenCodeReview completed with an unsafe status: $status" >&2
            exit 1
          fi

          blocking_count="$(jq '[.comments[]? | select(.severity == "critical" or .severity == "high")] | length' /tmp/ocr-result.json)"
          if ((blocking_count > 0)); then
            echo "OpenCodeReview found $blocking_count critical/high issue(s)." >&2
            exit 1
          fi

          echo 'OpenCodeReview gate passed: no critical/high issues.'
